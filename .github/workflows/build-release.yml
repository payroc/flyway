name: Build, Test & Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B verify -e -P-update-file-headers

      - name: Authenticate with Cloudsmith (OIDC)
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          oidc-namespace: payroc
          oidc-service-slug: tools-ci-service

      - name: Publish all modules to Cloudsmith
        run: |
          VERSION=$(mvn help:evaluate -q -DforceStdout -Dexpression=project.version)
          find . -maxdepth 3 -path "*/target/*-${VERSION}.pom" | while read pom; do
            jar="${pom%.pom}.jar"
            if [ -f "$jar" ]; then
              echo "Pushing $jar"
              cloudsmith push maven payroc/tools "$jar" --pom-file="$pom"
            fi
          done
